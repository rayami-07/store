<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Opciones de diseño</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#f4f3f1" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@800;900&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <style>
    /* ============================================================
       COMPARAR OPCIONES — ?t=id1,id2,id3
       Muestra las tiendas en celulares lado a lado (en computadora)
       o una por una con pestañas (en celular). Cada una tiene su
       botón "Me gusta esta" que avisa por WhatsApp a RAYAMI Store.
    ============================================================ */
    :root { --bg: #f4f3f1; --ink: #161412; --muted: #736e69; --line: #e4e1dd; --accent: #ff6a00; --wa: #1fa855;
      --display: 'Barlow Condensed', 'Arial Narrow', sans-serif; --body: 'DM Sans', 'Helvetica Neue', Arial, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); }
    [hidden] { display: none !important; }
    header { text-align: center; padding: 28px 16px 8px; }
    .kicker { font-size: 13px; color: var(--muted); letter-spacing: .04em; text-transform: uppercase; font-weight: 700; }
    h1 { font-family: var(--display); font-weight: 900; text-transform: uppercase; font-size: clamp(32px, 5vw, 54px); line-height: .95; margin: 6px 0 8px; }
    header p { margin: 0 auto; color: var(--muted); max-width: 560px; }
    .tabs { display: none; justify-content: center; gap: 6px; padding: 14px 12px 6px; position: sticky; top: 0; background: var(--bg); z-index: 5; }
    .tabs button { border: 1px solid var(--line); background: #fff; border-radius: 100px; padding: 8px 14px; font: inherit; font-weight: 500; cursor: pointer; }
    .tabs button.on { background: var(--ink); color: #fff; border-color: var(--ink); }
    .grid { display: grid; grid-template-columns: repeat(var(--n, 3), minmax(0, 380px)); justify-content: center; gap: 28px; padding: 22px 20px 40px; }
    .op { display: grid; gap: 12px; justify-items: center; }
    .op-top { text-align: center; }
    .op-top b { font-family: var(--display); font-weight: 900; text-transform: uppercase; font-size: 26px; display: block; line-height: 1; }
    .op-top span { color: var(--muted); font-size: 14px; }
    .phone { width: 100%; max-width: 380px; aspect-ratio: 9 / 18.5; border-radius: 40px; background: #111; padding: 10px; box-shadow: 0 20px 50px rgba(0,0,0,.18); }
    .phone iframe { width: 100%; height: 100%; border: 0; border-radius: 31px; background: #fff; display: block; }
    .op-btns { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
    .btn { display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 18px; border-radius: 100px; font-weight: 600; text-decoration: none; border: 1.5px solid transparent; font-size: 15px; }
    .btn-wa { background: var(--wa); color: #fff; }
    .btn-light { background: #fff; color: var(--ink); border-color: var(--line); }
    footer { text-align: center; color: var(--muted); font-size: 13px; padding: 0 16px 40px; }
    footer a { color: var(--ink); }
    .msg { text-align: center; padding: 80px 20px; color: var(--muted); }
    @media (max-width: 1100px) and (min-width: 801px) { .grid { gap: 18px; padding: 18px 12px 32px; } .phone { border-radius: 32px; padding: 8px; } .phone iframe { border-radius: 25px; } }
    /* En celular: una opción a la vez, con pestañas */
    @media (max-width: 800px) {
      .tabs { display: flex; }
      .grid { grid-template-columns: minmax(0, 420px); padding-top: 10px; }
      .op:not(.show) { display: none; }
      .phone { max-width: none; aspect-ratio: auto; height: 74vh; border-radius: 22px; padding: 6px; }
      .phone iframe { border-radius: 17px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="kicker">RAYAMI Store · Propuesta de diseño</div>
    <h1 id="title">Opciones de diseño</h1>
    <p>Toca y navega cada opción como si fueras tu cliente. Los productos son de ejemplo: al elegir, ponemos los tuyos.</p>
  </header>
  <nav class="tabs" id="tabs" aria-label="Opciones"></nav>
  <main class="grid" id="grid"><p class="msg">Cargando opciones…</p></main>
  <footer>¿Quieres otra combinación de colores o letra? Dinos y la ajustamos. · <a href="../servicios/" target="_blank" rel="noopener">Conoce RAYAMI Store</a></footer>

  <script type="module">
    import { DB_URL } from "./stats.js?v=1";
    import { PLANTILLAS } from "./muestras.js";
    const RAYAMI_WA = "525581074978";
    const esc = (t) => String(t ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
    const ids = (new URLSearchParams(location.search).get("t") || "").split(",").map((s) => s.trim()).filter((s) => /^[\w-]+$/.test(s)).slice(0, 4);
    const grid = document.getElementById("grid"), tabs = document.getElementById("tabs");

    async function main() {
      if (!ids.length) { grid.innerHTML = `<p class="msg">El link no tiene opciones.</p>`; return; }
      const stores = await Promise.all(ids.map((id) => fetch(`${DB_URL}/stores/${id}.json`).then((r) => r.json()).catch(() => null)));
      const ok = ids.map((id, i) => ({ id, s: stores[i] })).filter((x) => x.s && x.s.name);
      if (!ok.length) { grid.innerHTML = `<p class="msg">No encontramos estas opciones.</p>`; return; }
      const name = ok[0].s.name;
      document.title = `Opciones de diseño · ${name}`;
      document.getElementById("title").textContent = `${name}: ${ok.length} opciones`;
      grid.style.setProperty("--n", ok.length);
      grid.innerHTML = ok.map(({ id, s }, i) => {
        const label = PLANTILLAS[s.tema?.plantilla]?.label || "Diseño";
        const msg = `Hola, vi las opciones de diseño para ${name} y me gustó la Opción ${i + 1} (${label})`;
        return `<section class="op${i ? "" : " show"}" data-i="${i}">
          <div class="op-top"><b>Opción ${i + 1}</b><span>${esc(label)}</span></div>
          <div class="phone"><iframe src="./?t=${encodeURIComponent(id)}&op=1" title="Opción ${i + 1}: ${esc(label)}" loading="lazy"></iframe></div>
          <div class="op-btns">
            <a class="btn btn-wa" href="https://api.whatsapp.com/send?phone=${RAYAMI_WA}&text=${encodeURIComponent(msg)}" target="_blank" rel="noopener"><i class="fa-brands fa-whatsapp"></i> Me gusta esta</a>
            <a class="btn btn-light" href="./?t=${encodeURIComponent(id)}" target="_blank" rel="noopener"><i class="fa-solid fa-expand"></i> Pantalla completa</a>
          </div>
        </section>`;
      }).join("");
      tabs.innerHTML = ok.map((_, i) => `<button type="button" data-tab="${i}" class="${i ? "" : "on"}">Opción ${i + 1}</button>`).join("");
      tabs.addEventListener("click", (e) => {
        const b = e.target.closest("[data-tab]"); if (!b) return;
        tabs.querySelectorAll("button").forEach((x) => x.classList.toggle("on", x === b));
        grid.querySelectorAll(".op").forEach((o) => o.classList.toggle("show", o.dataset.i === b.dataset.tab));
      });
    }
    main();
  </script>
</body>
</html>
