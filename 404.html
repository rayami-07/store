<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RAYAMI Store</title>
  <meta name="robots" content="noindex" />
  <!-- LINKS CORTOS: rayamistore.com/tacoslupita
       GitHub Pages muestra esta página cuando la dirección no existe. Aquí se busca
       el nombre en Firebase (links/<nombre> = id de la tienda) y se abre esa tienda.
       Si no existe, se muestra "página no encontrada". -->
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, sans-serif; background: #f6f5f3; color: #161412; text-align: center; padding: 24px; box-sizing: border-box; }
    .spin { width: 30px; height: 30px; border: 3px solid #e6e3df; border-top-color: #161412; border-radius: 50%; animation: s .8s linear infinite; margin: 0 auto; }
    @keyframes s { to { transform: rotate(360deg); } }
    a { color: #ff6a00; font-weight: 600; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <div id="wait"><div class="spin"></div></div>
  <div id="nf" hidden>
    <h1 style="margin:0 0 8px">Página no encontrada</h1>
    <p style="color:#6b655f;margin:0 0 16px">Revisa que el link esté bien escrito.</p>
    <a href="/">Ir a RAYAMI Store</a>
  </div>
  <script>
    (async () => {
      const slug = decodeURIComponent(location.pathname).replace(/^\/+|\/+$/g, "").toLowerCase();
      let id = null;
      if (/^[a-z0-9-]{3,30}$/.test(slug)) {
        try { id = await fetch(`https://rayami-store-default-rtdb.firebaseio.com/links/${slug}.json`).then((r) => (r.ok ? r.json() : null)); } catch {}
      }
      if (typeof id === "string" && /^[a-z0-9-]{3,60}$/.test(id)) {
        const extra = new URLSearchParams(location.search); extra.delete("t");   // conserva ?mesa=5, etc.
        const q = extra.toString();
        location.replace(`/tienda/?t=${id}${q ? "&" + q : ""}${location.hash}`);
      } else {
        document.getElementById("wait").hidden = true;
        document.getElementById("nf").hidden = false;
      }
    })();
  </script>
</body>
</html>
